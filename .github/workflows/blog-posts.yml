name: Latest blog posts
on:
  schedule: [{cron: "0 12 * * *"}]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://www.jorgeasaur.us/rss.xml"
          max_post_count: 5
          commit_message: "Update blog posts - [Skip GitHub Action]"
